# Render Blueprint: managed PostgreSQL + Dockerised FastAPI backend (with headless Chromium).
# Deploy: Render dashboard → New → Blueprint → select this GitHub repo → Apply.
databases:
  - name: research-agent-db
    plan: basic-256mb
    databaseName: research_agent
    user: research

services:
  - type: web
    name: research-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: starter              # Chromium needs more memory than the free tier's 512 MB
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: research-agent-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: MAX_CONCURRENT_REQUESTS
        value: "3"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      # Shared password for the app. Render generates it; copy it from the dashboard and paste it
      # into the app's Settings page on each device. Keeps strangers from using your server.
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false            # your Vercel URL, e.g. https://professor-finder.vercel.app
      - key: OPENAI_API_KEY
        sync: false            # optional
      - key: LLM_MODEL
        value: gpt-4.1-mini
